name: Release

# Push a tag such as v0.2.0 to build remAIn.app and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version in the code
        run: |
          CODE="$(sed -n 's/.*remainVersion = "\(.*\)"/\1/p' Sources/RemainCore/Version.swift)"
          if [ "v$CODE" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Sources/RemainCore/Version.swift ($CODE)"; exit 1
          fi
      - name: Test
        run: swift test
      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/remAIn.app remAIn-${GITHUB_REF_NAME}.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "remAIn-${GITHUB_REF_NAME}.zip" \
            --title "remAIn ${GITHUB_REF_NAME}" --generate-notes
